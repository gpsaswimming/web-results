name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Generate directory indexes
        run: python scripts/generate_index.py .

      - name: Build season archives and scores feeds
        run: |
          for CSV in $(find . -maxdepth 2 -name "divisions.csv" | sort); do
            YEAR_DIR=$(dirname "$CSV")
            YEAR=$(basename "$YEAR_DIR")

            HTML_COUNT=$(find "$YEAR_DIR" -maxdepth 1 -name "*.html" ! -name "index.html" | wc -l)
            if [ "$HTML_COUNT" -eq 0 ]; then
              echo "Skipping $YEAR — no result files yet"
              continue
            fi

            echo "Building archive for $YEAR ($HTML_COUNT results)..."
            python scripts/build_season_index.py \
              -i "$YEAR_DIR" \
              -o "$YEAR_DIR" \
              --non-interactive \
              --verbose

            echo "Building scores.json feed for $YEAR..."
            python scripts/build_scores_json.py \
              -i "$YEAR_DIR" \
              -o "$YEAR_DIR" \
              --verbose
          done

      - name: Inject analytics into all pages
        run: |
          python scripts/test_inject_analytics.py
          python scripts/inject_analytics.py .

      # The Cloudflare project's production branch is `main`, so passing the
      # current branch name means main deploys to production and anything else
      # (i.e. `preview`) lands as a preview deployment, aliased at
      # <branch>.gpsa-results.pages.dev. Nothing about production changes.
      #
      # `preview` is a DISPOSABLE scratch surface, not a long-lived branch: it is
      # reset from main after each cutover. Merging several changes into it means
      # you validate the composite rather than the change you are about to ship,
      # so put one significant change on it at a time.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=gpsa-results --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
