<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPSA Invitational Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="https://assets.gpsaswimming.org/img/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://assets.gpsaswimming.org/img/favicons/favicon-16x16.png">
  <meta name="theme-color" content="#002366">
  <style>
/* GPSA invitational results — renderer styles.
   Brand: navy #002366 / red #d9242b / Inter. Signature accent: time-drop green. */

:root {
  --navy: #002366;
  --navy-2: #0033a0;
  --red: #d9242b;
  --red-2: #b81e24;
  --drop: #087f5b;          /* faster-than-seed green — the signature */
  --drop-bg: #e6f4ef;
  --add: #9aa2ad;           /* added time, muted on purpose */
  --gold: #c8971d;
  --silver: #79828f;
  --bronze: #a9611f;
  --ink: #17233b;
  --muted: #667085;
  --line: #e6e8ee;
  --bg: #eef1f5;
  --card: #ffffff;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.num { font-variant-numeric: tabular-nums; }

/* ---- sticky control bar --------------------------------------------------- */
.bar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 1180px; margin: 0 auto; padding: .6rem 1rem;
  display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
}
.bar-title { font-weight: 700; color: var(--navy); font-size: .95rem; margin-right: auto; }
.bar-title span { color: var(--muted); font-weight: 500; }

.ctrl { display: flex; align-items: center; gap: .4rem; }
input[type=search], select {
  font: inherit; font-size: .9rem; color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px;
  padding: .45rem .6rem; background: #fff; min-height: 40px;
}
input[type=search] { width: min(46vw, 220px); }
input[type=search]:focus, select:focus { outline: 2px solid var(--navy-2); outline-offset: 1px; border-color: var(--navy-2); }

.toggle { display: inline-flex; align-items: center; gap: .4rem; font-size: .9rem; cursor: pointer; user-select: none; }
.toggle input { width: 18px; height: 18px; accent-color: var(--navy); }

/* ---- hero ----------------------------------------------------------------- */
.hero {
  background: linear-gradient(135deg, var(--navy) 0%, #012a80 55%, var(--navy-2) 100%);
  color: #fff;
}
.hero-in { max-width: 1180px; margin: 0 auto; padding: 2rem 1rem 1.4rem; }
.eyebrow { text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; font-weight: 600; color: #9fc0ff; }
.hero h1 { font-size: clamp(1.6rem, 4.5vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; margin: .25rem 0; }
.hero .date { color: #c9d8ff; font-size: .95rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: .6rem; margin-top: 1.3rem; }
.stat { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: .8rem .9rem; }
.stat.hl { background: var(--drop); border-color: transparent; }
.stat.gold { background: var(--gold); border-color: transparent; }
.stat .n { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; letter-spacing: -.02em; }
.stat .l { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: #c9d8ff; }
.stat.hl .l { color: #d8f3e9; }
.stat.gold .l { color: #fff4d6; }

/* lane-line accent under the hero */
.lane { height: 6px; background: repeating-linear-gradient(90deg, var(--red) 0 22px, #fff 22px 30px, var(--navy) 30px 52px, #fff 52px 60px); }

/* ---- page body ------------------------------------------------------------ */
main { max-width: 1180px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }

details.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1rem; }
details.panel > summary { cursor: pointer; list-style: none; padding: .9rem 1.1rem; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: .5rem; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: '▸'; margin-left: auto; color: var(--muted); transition: transform .15s; }
details.panel[open] > summary::after { transform: rotate(90deg); }
.panel-body { padding: 0 1.1rem 1.1rem; }

/* medal table */
.medals { width: 100%; border-collapse: collapse; font-size: .92rem; }
/* Numbers (medals/points) right-aligned; rank + team name left-aligned. */
.medals th, .medals td { padding: .45rem .5rem; text-align: right; border-bottom: 1px solid var(--line); }
.medals th:first-child, .medals td:first-child,
.medals th:nth-child(2), .medals td:nth-child(2) { text-align: left; }
.medals thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.medals tbody tr { cursor: pointer; }
.medals tbody tr:hover { background: #f6f8fb; }
.medals td.tot { font-weight: 700; }
.rank { color: var(--muted); width: 1.6rem; }

/* jump-to-event grid */
.jump { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .35rem; }
.jump a { font-size: .82rem; color: var(--ink); text-decoration: none; padding: .35rem .5rem; border-radius: 8px; border: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jump a:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
.jump a b { color: var(--navy); }
.jump a:hover b { color: #fff; }

/* ---- event cards ---------------------------------------------------------- */
.event { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: .9rem; overflow: hidden; scroll-margin-top: 72px; }
.hidden { display: none !important; }
.ev-head { padding: .75rem 1.1rem; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.ev-num { font-weight: 800; color: var(--red); font-size: .8rem; }
.ev-title { font-weight: 700; }
.ev-tag { margin-left: auto; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

.tbl-wrap { overflow-x: auto; }
/* Fixed layout + shared column widths so every event card's columns line up down the
   page (auto-layout would size each table's columns to its own data and drift). */
table.res { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 520px; table-layout: fixed; }
.c-pl { width: 44px; } .c-team { width: 66px; } .c-seed { width: 80px; }
.c-time { width: 80px; } .c-pm { width: 78px; } .c-cm { width: 48px; }  /* c-name takes the rest */
table.res th, table.res td { padding: .5rem .7rem; text-align: left; white-space: nowrap; }
table.res thead th { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); }
table.res tbody tr + tr td { border-top: 1px solid #f1f3f7; }
table.res td.r, table.res th.r { text-align: right; }
table.res td.c, table.res th.c { text-align: center; }
table.res .name { width: 99%; white-space: normal; }

.pl { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; border-radius: 50%; font-weight: 700; font-size: .82rem; background: #f0f2f6; color: var(--ink); }
/* GPSA place-ribbon colors, 1st-8th (9+ stay plain gray = no award). */
.pl.p1 { background: #1857b0; color: #fff; }                                   /* blue */
.pl.p2 { background: #cf2e2e; color: #fff; }                                   /* red */
.pl.p3 { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px #c7cfdb; } /* white */
.pl.p4 { background: #e8b800; color: #3d3000; }                                /* yellow */
.pl.p5 { background: #7d1f3d; color: #fff; }                                   /* maroon */
.pl.p6 { background: #1f8a4c; color: #fff; }                                   /* green */
.pl.p7 { background: #6a3aa0; color: #fff; }                                   /* purple */
.pl.p8 { background: #1a1a1a; color: #fff; }                                   /* black */

.swm { background: none; border: none; font: inherit; color: var(--ink); font-weight: 600; cursor: pointer; padding: 0; text-align: left; }
.swm:hover { color: var(--navy-2); text-decoration: underline; }

.team { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--navy); background: #eaf0fb; border-radius: 6px; padding: .1rem .4rem; }

.relay-tag { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--red); margin-right: .35rem; }
table.res td.name { white-space: normal; }  /* relay leg lists wrap */

.drop { color: var(--drop); font-weight: 700; }
.addt { color: var(--add); }
.cut { flex-shrink: 0; display: inline-block; font-size: .66rem; font-weight: 700; color: #fff; background: var(--gold); border-radius: 6px; padding: .1rem .45rem; letter-spacing: .03em; white-space: nowrap; vertical-align: middle; }
.legend .cut { color: #fff; }
.badge { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: .1rem .4rem; border-radius: 6px; }
.badge.dq { background: #fdeaea; color: var(--red-2); }
.badge.sc { background: #f0f2f6; color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }
.legend { font-size: .78rem; color: var(--muted); margin: .3rem 0 1rem; display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: center; }
.legend b { color: var(--drop); }
.medal-key { display: inline-flex; align-items: center; gap: 3px; }
.medal-key .pl { width: 20px; height: 20px; min-width: 20px; font-size: .66rem; }
.medal-key .pl:last-of-type { margin-right: 5px; }

/* ---- swimmer modal -------------------------------------------------------- */
.modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center; background: rgba(10, 20, 45, .5); padding: 0; }
.modal.open { display: flex; }
.sheet { background: #fff; width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; border-radius: 16px 16px 0 0; }
@media (min-width: 640px) { .modal { align-items: center; padding: 1rem; } .sheet { border-radius: 16px; } }
.sheet-head { position: sticky; top: 0; background: var(--navy); color: #fff; padding: 1rem 1.2rem; display: flex; align-items: center; gap: .6rem; }
.sheet-head h3 { font-size: 1.1rem; font-weight: 800; }
.sheet-head .sub { color: #c9d8ff; font-size: .82rem; }
.sheet-close { margin-left: auto; background: rgba(255,255,255,.15); color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
.sheet-body { padding: .4rem 1.2rem 1.4rem; }
.swim-row { display: grid; grid-template-columns: auto 1fr auto; gap: .3rem .7rem; align-items: baseline; padding: .6rem 0; border-bottom: 1px solid #f1f3f7; }
.swim-row .ev { color: var(--muted); font-size: .78rem; grid-column: 1 / -1; }
.swim-row .time { font-weight: 700; }

footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 1.5rem 1rem; }
footer a { color: var(--navy-2); }

@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .bar-title { width: 100%; margin: 0 0 .2rem; }
  .col-seed { display: none; }
  .c-seed { width: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

bakian|tristan|13-14","seed":{"t":"36.58","s":36.58},"final":{"t":"36.93","s":36.93},"place":1,"status":"ok","dq":false,"pts":9},{"name":"Cox, Nairobi K","team":"RRST","sid":"cox|nairobi|13-14","seed":{"t":"39.49","s":39.49},"final":{"t":"38.94","s":38.94},"place":2,"status":"ok","dq":false,"pts":7},{"name":"Lawson, Noah C","team":"GG","sid":"lawson|noah|13-14","seed":{"t":"40.72","s":40.72},"final":{"t":"39.16","s":39.16},"place":3,"status":"ok","dq":false,"pts":6},{"name":"Coleman, Jacob","team":"WYCC","sid":"coleman|jacob|13-14","seed":{"t":"38.59","s":38.59},"final":{"t":"39.27","s":39.27},"place":4,"status":"ok","dq":false,"pts":5},{"name":"Frankowski, Alex","team":"CV","sid":"frankowski|alex|13-14","seed":{"t":"40.88","s":40.88},"final":{"t":"40.48","s":40.48},"place":5,"status":"ok","dq":false,"pts":4},{"name":"Rowe, Joshua","team":"RRST","sid":"rowe|joshua|13-14","seed":{"t":"41.38","s":41.38},"final":{"t":"42.47","s":42.47},"place":6,"status":"ok","dq":false,"pts":3},{"name":"Mowery, Alex","team":"WO","sid":"mowery|alex|13-14","seed":{"t":"41.03","s":41.03},"final":{"t":"42.49","s":42.49},"place":7,"status":"ok","dq":false,"pts":2},{"name":"Burns, Jerry M","team":"CV","sid":"burns|jerry|13-14","seed":{"t":"44.00","s":44},"final":{"t":"45.03","s":45.03},"place":8,"status":"ok","dq":false,"pts":1}]}]};</script>
<script type="module">
// GPSA invitational results renderer.
// Data source: window.__MEET__ (inlined preview) or fetch ../data/<slug>.json.

const MEDAL_DEPTH = 8; // this league awards medals to 8th place
let showCutCol = true; // set per-render: the CM column only appears when the meet has cuts

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Only official ("ok") swims count — a DQ/scratch/DNF time doesn't stand, so it never
// shows a drop, counts as faster-than-seed, or gets highlighted.
const dropOf = (r) => (r.status === 'ok' && r.seed && r.final && r.final.s < r.seed.s ? r.seed.s - r.final.s : 0);
const addOf = (r) => (r.status === 'ok' && r.seed && r.final && r.final.s > r.seed.s ? r.final.s - r.seed.s : 0);
// boot() is invoked at the END of this file, after every const/helper is initialized —
// with inlined data render() runs synchronously, so nothing can be in its TDZ.

async function boot() {
  const app = document.getElementById('app');
  try {
    let data = window.__MEET__;
    if (!data) {
      const slug = new URLSearchParams(location.search).get('meet')
        || document.documentElement.dataset.defaultMeet;
      const res = await fetch(`../data/${slug}.json`);
      if (!res.ok) throw new Error(`data ${res.status}`);
      data = await res.json();
    }
    render(app, data);
  } catch (e) {
    app.innerHTML = `<p class="empty">Couldn't load these results. ${esc(e.message)}</p>`;
  }
}

function render(app, data) {
  // Events arrive in file order; render by event number (numeric prefix, then any
  // A/B/C… sub-group suffix) so the meet reads 1 → last regardless of source order.
  const evKey = (e) => { const m = /^(\d+)(.*)$/.exec(e.number); return m ? [+m[1], m[2]] : [1e9, e.number]; };
  data.events.sort((a, b) => { const x = evKey(a), y = evKey(b); return x[0] - y[0] || x[1].localeCompare(y[1]); });

  const teamName = Object.fromEntries(data.teams.map((t) => [t.code, t.name]));
  const allResults = data.events.flatMap((e) => e.results.map((r) => ({ ...r, ev: e })));

  // ---- derived stats -------------------------------------------------------
  const swimmers = new Set(allResults.filter((r) => r.sid).map((r) => r.sid));
  const drops = allResults.filter((r) => dropOf(r) > 0).length;
  const cuts = allResults.filter((r) => r.cut).length;
  const withSeed = allResults.filter((r) => r.seed && r.final).length;
  const teamsWithSwims = new Set(allResults.map((r) => r.team));
  showCutCol = !!data.meet.cutsLabel; // no CM column when standards weren't applied (e.g. City Meet)

  // ---- team scores (points carried in the file; e.g. City Meet 9-7-6-5-4…) -
  const scored = allResults.some((r) => r.pts);
  const teamPts = {};
  if (scored) for (const r of allResults) if (r.pts) teamPts[r.team] = (teamPts[r.team] || 0) + r.pts;
  const scoreRows = Object.entries(teamPts).map(([code, pts]) => ({ code, pts }))
    .sort((a, b) => b.pts - a.pts || a.code.localeCompare(b.code));
  const fmtPts = (p) => (Number.isInteger(p) ? p : p.toFixed(1));

  // ---- medal tally (individual, places 1-3) --------------------------------
  const medals = {};
  for (const r of allResults) {
    if (r.status !== 'ok' || !r.place || r.place > 3) continue;
    const m = (medals[r.team] ||= { g: 0, s: 0, b: 0 });
    if (r.place === 1) m.g++; else if (r.place === 2) m.s++; else m.b++;
  }
  const medalRows = Object.entries(medals)
    .map(([code, m]) => ({ code, ...m, tot: m.g + m.s + m.b }))
    .sort((a, b) => b.g - a.g || b.s - a.s || b.b - a.b || a.code.localeCompare(b.code));

  // ---- swimmer index (for the profile sheet) -------------------------------
  const bySwimmer = {};
  for (const r of allResults) {
    if (!r.sid) continue; // relay legs have no swimmer id — not in the per-swimmer index
    (bySwimmer[r.sid] ||= { name: r.name, team: r.team, swims: [] }).swims.push(r);
  }

  const dateStr = new Date(data.meet.startDate + 'T00:00').toLocaleDateString('en-US',
    { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const medalPanel = data.meet.showMedals ? `
      <details class="panel" open><summary>🏅 Team medal count</summary>
        <div class="panel-body"><table class="medals"><thead><tr>
          <th></th><th>Team</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Total</th>
        </tr></thead><tbody>
          ${medalRows.map((m, i) => `<tr data-team="${esc(m.code)}">
            <td class="rank num">${i + 1}</td>
            <td>${esc(teamName[m.code] || m.code)}</td>
            <td class="num">${m.g || ''}</td><td class="num">${m.s || ''}</td>
            <td class="num">${m.b || ''}</td><td class="num tot">${m.tot}</td>
          </tr>`).join('')}
        </tbody></table></div>
      </details>` : '';

  // A scored meet (City Meet) leads with team points; otherwise fall back to the
  // opt-in medal count. Clicking a row filters the page to that team (wired via .medals).
  const scoresPanel = `
      <details class="panel" open><summary>🏆 Team scores</summary>
        <div class="panel-body"><table class="medals"><thead><tr>
          <th></th><th>Team</th><th>Points</th>
        </tr></thead><tbody>
          ${scoreRows.map((t, i) => `<tr data-team="${esc(t.code)}">
            <td class="rank num">${i + 1}</td>
            <td>${esc(teamName[t.code] || t.code)}</td>
            <td class="num tot">${fmtPts(t.pts)}</td>
          </tr>`).join('')}
        </tbody></table></div>
      </details>`;
  const teamPanel = scored ? scoresPanel : medalPanel;

  app.innerHTML = `
    <header class="hero"><div class="hero-in">
      <div class="eyebrow">${esc(data.meet.eyebrow || 'GPSA Invitational')}</div>
      <h1>${esc(data.meet.name)}</h1>
      <div class="date">${esc(dateStr)}</div>
      <div class="stats">
        <div class="stat"><div class="n num">${swimmers.size}</div><div class="l">Swimmers</div></div>
        <div class="stat"><div class="n num">${teamsWithSwims.size}</div><div class="l">Teams</div></div>
        <div class="stat"><div class="n num">${data.events.length}</div><div class="l">Events</div></div>
        <div class="stat hl"><div class="n num">${drops}</div><div class="l">Faster than seed</div></div>
        ${cuts ? `<div class="stat gold"><div class="n num">${cuts}</div><div class="l">City Meet cuts</div></div>` : ''}
      </div>
    </div></header>
    <div class="lane"></div>

    <div class="bar"><div class="bar-in">
      <div class="bar-title">${esc(shortName(data.meet.name))} <span>Results</span></div>
      <div class="ctrl"><input type="search" id="q" placeholder="Search a swimmer…" aria-label="Search swimmer"></div>
      <div class="ctrl"><select id="team" aria-label="Filter by team">
        <option value="">All teams</option>
        ${data.teams.filter((t) => teamsWithSwims.has(t.code))
          .sort((a, b) => a.name.localeCompare(b.name))
          .map((t) => `<option value="${esc(t.code)}">${esc(t.name)}</option>`).join('')}
      </select></div>
      <label class="toggle"><input type="checkbox" id="top8"> Top 8 only</label>
    </div></div>

    <main>
      ${teamPanel}

      <details class="panel"><summary>↳ Jump to event</summary>
        <div class="panel-body"><div class="jump">
          ${data.events.map((e) => `<a href="#e${esc(e.number)}"><b>#${esc(e.number)}</b> ${esc(shortEvent(e))}</a>`).join('')}
        </div></div>
      </details>

      <p class="legend"><span><b>▼ faster than seed</b> (dropped time)</span>
        ${cuts ? '<span><span class="cut">CM</span> made a City Meet qualifying time</span>' : ''}
        <span class="medal-key">${Array.from({ length: MEDAL_DEPTH }, (_, i) =>
          `<span class="pl p${i + 1}">${i + 1}</span>`).join('')} medals to 8th</span>
        <span>Tap a name for every swim</span></p>

      <div id="events">
        ${data.events.map((e) => eventCard(e)).join('')}
      </div>
      <p class="empty hidden" id="none">No swims match your filters.</p>
    </main>
    <footer>${esc(data.meet.name)} · ${withSeed} swims with a seed time, ${drops} faster than seed ·
      <a href="/invitationals/">All GPSA invitationals</a></footer>`;

  wire(app, { bySwimmer, teamName });
}

function eventCard(e) {
  const rows = e.results.map((r) => (r.kind === 'relay' ? relayRow(r) : indivRow(r))).join('');
  return `<section class="event" id="e${esc(e.number)}" data-num="${esc(e.number)}">
    <div class="ev-head"><span class="ev-num">EVENT ${esc(e.number)}</span>
      <span class="ev-title">${esc(e.description)}</span></div>
    <div class="tbl-wrap"><table class="res">
      <colgroup><col class="c-pl"><col class="c-name"><col class="c-team"><col class="c-seed"><col class="c-time"><col class="c-pm">${showCutCol ? '<col class="c-cm">' : ''}</colgroup>
      <thead><tr>
      <th class="r">Pl</th><th>Swimmer</th><th>Team</th>
      <th class="r col-seed">Seed</th><th class="r">Time</th><th class="r">±</th>${showCutCol ? '<th class="c">CM</th>' : ''}
    </tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}

function indivRow(r) {
  const d = dropOf(r), a = addOf(r);
  let placeCell, timeCell, dropCell;
  if (r.status === 'ok') {
    // GPSA place-ribbon color for 1st-8th; 9+ get no award color.
    const cls = r.place && r.place <= MEDAL_DEPTH ? ` p${r.place}` : '';
    placeCell = r.place ? `<span class="pl${cls}">${r.place}</span>` : '';
    timeCell = r.final ? `<span class="num">${esc(r.final.t)}</span>` : '';
    dropCell = d > 0 ? `<span class="drop num">▼ ${d.toFixed(2)}</span>`
      : a > 0 ? `<span class="addt num">▲ ${a.toFixed(2)}</span>` : '';
  } else {
    // DQ/scratch/DNF: the time doesn't stand, so no place, no time, no drop — just the reason.
    placeCell = '';
    timeCell = '';
    dropCell = `<span class="badge ${r.dq ? 'dq' : 'sc'}">${r.dq ? 'DQ' : r.status}</span>`;
  }
  const cutCell = r.cut ? '<span class="cut">CM</span>' : '';
  return `<tr data-name="${esc(r.name.toLowerCase())}" data-team="${esc(r.team)}"
      data-place="${r.place || 99}" data-sid="${esc(r.sid)}">
    <td class="r">${placeCell}</td>
    <td class="name"><button class="swm" data-sid="${esc(r.sid)}">${esc(r.name)}</button></td>
    <td><span class="team">${esc(r.team)}</span></td>
    <td class="r col-seed num">${r.seed ? esc(r.seed.t) : ''}</td>
    <td class="r">${timeCell}</td>
    <td class="r">${dropCell}</td>
    ${showCutCol ? `<td class="c">${cutCell}</td>` : ''}
  </tr>`;
}

// Relays: team + letter + leg names, no individual swimmer, no medal color (no relay
// medals in this league), no City Meet cut.
function relayRow(r) {
  const ok = r.status === 'ok';
  const d = dropOf(r);
  const placeCell = ok && r.place ? `<span class="pl">${r.place}</span>` : '';
  const timeCell = ok && r.final ? `<span class="num">${esc(r.final.t)}</span>` : '';
  const endCell = !ok ? `<span class="badge ${r.dq ? 'dq' : 'sc'}">${r.dq ? 'DQ' : r.status}</span>`
    : d > 0 ? `<span class="drop num">▼ ${d.toFixed(2)}</span>` : '';
  const legNames = (r.legs || []).join(', ');
  return `<tr data-name="${esc(legNames.toLowerCase())}" data-team="${esc(r.team)}"
      data-place="${r.place || 99}" data-sid="">
    <td class="r">${placeCell}</td>
    <td class="name"><span class="relay-tag">'${esc(r.letter)}' relay</span> ${esc(legNames)}</td>
    <td><span class="team">${esc(r.team)}</span></td>
    <td class="r col-seed num">${r.seed ? esc(r.seed.t) : ''}</td>
    <td class="r">${timeCell}</td>
    <td class="r">${endCell}</td>
    ${showCutCol ? '<td class="c"></td>' : ''}
  </tr>`;
}

function wire(app, { bySwimmer, teamName }) {
  const q = app.querySelector('#q');
  const team = app.querySelector('#team');
  const top8 = app.querySelector('#top8');
  const none = app.querySelector('#none');
  const events = [...app.querySelectorAll('.event')];

  const apply = () => {
    const needle = q.value.trim().toLowerCase();
    const t = team.value;
    const only8 = top8.checked;
    let anyVisible = false;
    for (const ev of events) {
      let shown = 0;
      for (const tr of ev.querySelectorAll('tbody tr')) {
        const ok = (!needle || tr.dataset.name.includes(needle))
          && (!t || tr.dataset.team === t)
          && (!only8 || +tr.dataset.place <= 8);
        tr.classList.toggle('hidden', !ok);
        if (ok) shown++;
      }
      ev.classList.toggle('hidden', shown === 0);
      if (shown) anyVisible = true;
    }
    none.classList.toggle('hidden', anyVisible);
  };

  q.addEventListener('input', apply);
  team.addEventListener('change', apply);
  top8.addEventListener('change', apply);

  // medal row → set team filter
  app.querySelectorAll('.medals tbody tr').forEach((tr) => {
    tr.addEventListener('click', () => {
      team.value = tr.dataset.team; apply();
      document.getElementById('events').scrollIntoView({ behavior: 'smooth' });
    });
  });

  // swimmer name → profile sheet
  app.addEventListener('click', (e) => {
    const btn = e.target.closest('.swm');
    if (btn) openSheet(bySwimmer[btn.dataset.sid], teamName);
  });
}

function openSheet(sw, teamName) {
  if (!sw) return;
  const modal = document.getElementById('modal');
  const rows = sw.swims.map((r) => {
    const d = dropOf(r);
    const ok = r.status === 'ok';
    const time = ok && r.final ? r.final.t : '—';
    const tail = !ok ? `<span class="badge ${r.dq ? 'dq' : 'sc'}">${r.dq ? 'DQ' : r.status}</span>`
      : `${r.cut ? '<span class="cut">CM</span> ' : ''}${d > 0 ? `<span class="drop num">▼ ${d.toFixed(2)}</span>` : ''}`;
    const pl = ok && r.place ? `${ordinal(r.place)} · ` : '';
    return `<div class="swim-row">
      <div class="ev">EV ${esc(r.ev.number)} · ${esc(r.ev.description)}</div>
      <div class="time num">${esc(time)}</div>
      <div class="num" style="color:var(--muted)">${r.seed ? 'seed ' + esc(r.seed.t) : ''}</div>
      <div style="text-align:right">${pl}${tail}</div>
    </div>`;
  }).join('');
  modal.innerHTML = `<div class="sheet">
    <div class="sheet-head">
      <div><h3 id="sheet-name">${esc(sw.name)}</h3>
        <div class="sub">${esc(teamName[sw.team] || sw.team)} · ${sw.swims.length} swim${sw.swims.length === 1 ? '' : 's'}</div></div>
      <button class="sheet-close" aria-label="Close">×</button>
    </div><div class="sheet-body">${rows}</div></div>`;
  modal.classList.add('open');
  modal.querySelector('.sheet-close').focus();
  const close = () => modal.classList.remove('open');
  modal.querySelector('.sheet-close').onclick = close;
  modal.onclick = (e) => { if (e.target === modal) close(); };
  document.addEventListener('keydown', function esc2(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc2); }
  });
}

const shortName = (n) => n.replace(/^\d{4}\s+GPSA\s+/, '').replace(/\s+Invitational$/, '');
const shortEvent = (e) => `${e.gender === 'F' ? 'Girls' : e.gender === 'M' ? 'Boys' : ''} ${e.ageGroup} ${e.distance} ${e.stroke.slice(0, 4)}`.trim();
const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

boot();

</script>
